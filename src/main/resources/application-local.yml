server:
  port: 8080

spring:
  application:
    name: Temple Backend API - Local
  datasource:
    url: jdbc:postgresql://localhost:5432/templedb
    driver-class-name: org.postgresql.Driver
    username: postgres
    password: admin123
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        "[format_sql]": true
        "[dialect]": org.hibernate.dialect.PostgreSQLDialect
  sql:
    init:
      mode: never
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB
      file-size-threshold: 2MB
  mail:
    host: smtp.gmail.com
    port: 587
    username: your-email@gmail.com
    password: your-app-password
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

jwt:
  secret: TempleSecretKeyForJWTAuthenticationWithHighSecurityLevel2024
  expiration: 86400000

app:
  auth:
    enabled: false
    basic-enabled: true

logging:
  level:
    root: INFO
    "[com.temple]": DEBUG
    "[com.temple.security]": DEBUG
    "[org.hibernate.orm.deprecation]": WARN
    "[org.springframework.mail]": DEBUG
