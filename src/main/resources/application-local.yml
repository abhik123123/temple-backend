# Local development:  ./mvnw spring-boot:run -Dspring-boot.run.profiles=local
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/templedb}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  flyway:
    # Sample timings, events, staff, etc. (only inserted into empty tables)
    locations: classpath:db/migration,classpath:db/dev-seed

app:
  security:
    # Dev-only fallback so the app starts without configuration. NEVER use in production.
    jwt-secret: ${JWT_SECRET:ZGV2LW9ubHktc2VjcmV0LWNoYW5nZS1tZS1kZXYtb25seS1zZWNyZXQtY2hhbmdlLW1l}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000}
  bootstrap-admin:
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:ChangeMe-Local-Only-123}

logging:
  level:
    com.temple: DEBUG
