# Production-safe defaults: every secret / environment-specific value comes from
# an environment variable (see .env.example). Local development: profile "local".
spring:
  application:
    name: temple-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/templedb}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none            # schema is owned by Flyway (db/migration)
    # No hibernate.jdbc.time_zone: LocalDate/LocalTime are calendar dates and
    # temple wall-clock times (IST, the container's TZ) and must be stored as-is.
    # Converting them to UTC shifted every darshan time by 5h30m in the database.
  flyway:
    enabled: true
    locations: classpath:db/migration
    # Databases created earlier by "ddl-auto: update" are adopted at V1 and upgraded from there.
    baseline-on-migrate: true
    baseline-version: 1
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  mvc:
    problemdetails:
      enabled: true
  jackson:
    default-property-inclusion: non_null
  # Email is optional: set SPRING_MAIL_HOST/_PORT/_USERNAME/_PASSWORD to enable it.
  mail:
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

server:
  port: ${PORT:8080}
  servlet:
    context-path: /api
  shutdown: graceful
  forward-headers-strategy: framework
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

app:
  security:
    # base64, >= 32 bytes:  openssl rand -base64 48
    jwt-secret: ${JWT_SECRET:}
    jwt-ttl: ${JWT_TTL:8h}
    issuer: temple-backend
    login-max-attempts: 5
    login-lockout: 15m
  cors:
    # Comma-separated. Not needed when the UI proxies /api on the same origin.
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:}
  bootstrap-admin:
    # Created on first start if the admins table is empty. Change the password afterwards.
    username: ${ADMIN_USERNAME:}
    password: ${ADMIN_PASSWORD:}
    display-name: ${ADMIN_DISPLAY_NAME:Temple Admin}
    email: ${ADMIN_EMAIL:}
  photos:
    max-bytes: 5242880
  newsletter:
    from: ${NEWSLETTER_FROM:no-reply@rajarajeshwara.org}
    enabled: ${NEWSLETTER_ENABLED:false}
    cron: "0 0 2 * * SUN"
    zone: Asia/Kolkata
    # Public site URL used in email links (unsubscribe, events page)
    site-url: ${SITE_URL:http://localhost:3000}

logging:
  level:
    root: INFO
    com.temple: INFO
