# Full stack: PostgreSQL + backend + UI (nginx).  Usage:
#   cp .env.example .env   # fill in passwords, JWT_SECRET, ADMIN_PASSWORD
#   docker compose up -d --build
# Expects the Temple-UI repository checked out next to this one (../Temple-UI).
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-templedb}
      POSTGRES_USER: ${DB_USERNAME:-temple}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-templedb}
      DB_USERNAME: ${DB_USERNAME:-temple}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      JWT_TTL: ${JWT_TTL:-8h}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_DISPLAY_NAME: ${ADMIN_DISPLAY_NAME:-Temple Admin}
      SPRING_MAIL_HOST: ${SPRING_MAIL_HOST:-}
      SPRING_MAIL_PORT: ${SPRING_MAIL_PORT:-587}
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME:-}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD:-}
      NEWSLETTER_FROM: ${NEWSLETTER_FROM:-no-reply@rajarajeshwara.org}
      NEWSLETTER_ENABLED: ${NEWSLETTER_ENABLED:-false}
      SITE_URL: ${SITE_URL:-http://localhost}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-}
    # Not published: reachable only through the UI's nginx at /api

  ui:
    build: ../Temple-UI
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      BACKEND_URL: http://backend:8080
    ports:
      - "80:80"

volumes:
  db-data:
